[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]
# The invariant suite's opt-in coverage log (GHO19_COVERAGE=1) and nothing else.
fs_permissions = [{ access = "write", path = "./cache/invariant-coverage.txt" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

# GHO-19. `fail_on_revert` is load-bearing: every handler action filters its
# own preconditions, so an unexpected revert is a finding rather than noise.
[invariant]
runs = 64
depth = 128
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum_one = "${ARBITRUM_ONE_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
# GHO-21. Robinhood Chain is an Arbitrum Orbit/Nitro L2 with ETH gas, so
# Foundry needs nothing but the endpoint. Verified live on 2026-09-25:
# chain 46630, nitro/v3.12.0-rc.3, gas 0.01 gwei, multicall3 deployed at the
# canonical address (which wagmi's batched reads depend on).
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum_one = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
# Robinhood Chain is deliberately absent here. Foundry 1.2.3 resolves the
# `chain` field of an `[etherscan]` entry against its own built-in list, and an
# id it does not know fails the whole command — `Error: Chain 46630 not
# supported` — before it gets anywhere near a deploy. Not a verification error
# either: it stops `forge script` too, so one unused config entry breaks the
# deploy it was added to support.
#
# Blockscout is verified with explicit flags instead, which need no entry here:
#
#   forge verify-contract --verifier blockscout \
#     --verifier-url https://explorer.testnet.chain.robinhood.com/api ADDRESS PATH:NAME
#
# Confirmed that instance accepts it: 1657 solc builds offered, 0.8.26 among
# them, and `standard-input` supported, which reproduces our optimizer settings
# exactly rather than by flattening.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
