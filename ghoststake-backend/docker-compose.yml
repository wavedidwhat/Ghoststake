# Configuration reaches the containers through `env_file`, never through
# `${VAR}` interpolation in this file.
#
# Interpolation is resolved by the compose *client*, against whichever env file
# it was invoked with — and the RDK extension invokes it with
# `--env-file .env.remote`, which holds RDK's own settings and none of the
# app's. `--env-file` replaces the default `.env` rather than adding to it, so
# every `${VAR:-default}` quietly took its default and `${JWT_SECRET:?...}`
# failed the deploy with an interpolation error. `env_file` is read per service
# and does not care how the client was called.
#
# Layering: `deploy.defaults.env` (committed, topology) then `.env`
# (uncommitted, real config), later file wins. `environment:` below outranks
# both, so it holds only what the compose topology itself fixes.
services:
  api:
    build:
      context: .
    image: ghoststake-api
    # No host port here. On the VPS, Traefik reaches this container over the
    # shared proxy network using the port below — publishing to the host would
    # collide with whatever already owns it. Local access comes from
    # docker-compose.override.yml.
    expose:
      - "8080"
    env_file:
      - path: deploy.defaults.env
        required: true
      # Optional so `docker compose config` and a fresh clone still work. A
      # missing .env is not silently fine — it means no JWT_SECRET, and the
      # API refuses to boot and says so.
      - path: .env
        required: false
    environment:
      # Fixed by `expose` above, so it is not an operator's to change.
      HTTP_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    # Defaults only, deliberately not `.env`: this container has no business
    # holding the API's JWT_SECRET or RPC credentials, and layering `.env` here
    # would hand it every one of them. Postgres ignores what it does not
    # recognise, so it would never complain — which is what makes it worth
    # being explicit about.
    #
    # The consequence is that POSTGRES_* must be changed in
    # deploy.defaults.env, alongside the DATABASE_URL that has to match.
    # Setting them in `.env` would move the API without moving the database.
    env_file:
      - path: deploy.defaults.env
        required: true
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The API runs migrations on boot, so it must not start until Postgres is
    # actually accepting connections — not merely "container started".
    #
    # `$$` escapes compose's own interpolation, so the variables are expanded
    # by the shell inside the container against what env_file actually set.
    # Interpolating them here would check a different user than the one
    # Postgres was created with the moment `.env` overrides either.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
