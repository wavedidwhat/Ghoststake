# Local-only. Compose auto-loads this for a bare `docker compose up`, but NOT
# when files are passed explicitly with -f (how the VPS deploy works), so these
# host port bindings never reach the server.
services:
  api:
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development

  db:
    ports:
      - "5432:5432"
