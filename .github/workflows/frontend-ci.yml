name: frontend-ci

on:
  push:
    branches: ["main"]
    paths:
      - "ghoststake-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # No path filter here on purpose: a workflow skipped by path filtering
  # never reports its check, and a REQUIRED check that never reports leaves
  # the PR permanently "Expected — waiting for status". Cheap to just run.
  pull_request:

defaults:
  run:
    working-directory: ghoststake-frontend

jobs:
  build:
    name: lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ghoststake-frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ghoststake-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build # next build type-checks as part of the build
