name: frontend-ci

on:
  push:
    paths:
      - "ghoststake-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "ghoststake-frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: ghoststake-frontend

jobs:
  build:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ghoststake-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
