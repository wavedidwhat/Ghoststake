name: frontend-ci

on:
  push:
    branches: ["main"]
    paths:
      - "ghoststake-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # No path filter here on purpose: a workflow skipped by path filtering
  # never reports its check, and a REQUIRED check that never reports leaves
  # the PR permanently "Expected — waiting for status". Cheap to just run.
  pull_request:

defaults:
  run:
    working-directory: ghoststake-frontend

jobs:
  build:
    # Name is pinned: it is a required status check, so renaming it (even to
    # add "test") would leave every PR waiting on a check that never reports.
    name: lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ghoststake-frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ghoststake-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Built once, with the configuration the browser tests expect (GHO-87):
      # fake contract addresses that tests/mock-chain.ts answers for, from
      # tests/e2e.env. Still the full production build and type-check — only
      # the inlined NEXT_PUBLIC_ values differ, and those differ per
      # deployment anyway.
      - name: Build
        run: pnpm build:e2e # next build type-checks as part of the build

      # Layout tests run in the same job rather than their own (GHO-59): a
      # second job would be a second required check to configure, and this one
      # already has the build the Playwright server needs. Only Chromium is
      # installed — the suite pins Chromium metrics explicitly, so the other
      # two browsers would be ~300MB of download for nothing.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Layout tests (390px and 1440px)
        run: pnpm test:layout

      # The screenshots of a failure are the whole point of having these.
      #
      # v3, not v4. v4 refuses to run anywhere but github.com
      # ("GHESNotSupportedError"), and CI has run on Forgejo since Part 7.60 —
      # so this step has failed on every red run since, and the screenshots it
      # exists for were never kept.
      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: ghoststake-frontend/test-results/
          retention-days: 7
