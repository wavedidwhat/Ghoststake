name: contracts-ci

on:
  push:
    branches: ["main"]
    paths:
      - "ghoststake-contracts/**"
      - ".github/workflows/contracts-ci.yml"
  # No path filter here on purpose: a workflow skipped by path filtering
  # never reports its check, and a REQUIRED check that never reports leaves
  # the PR permanently "Expected — waiting for status". Cheap to just run.
  pull_request:

defaults:
  run:
    working-directory: ghoststake-contracts

jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned so `forge fmt` agrees with local dev machines — different
          # forge versions format borderline lines differently, which turns
          # `forge fmt --check` into a moving target. Bump deliberately and
          # tell contributors to `foundryup --version <tag>` in sync.
          version: v1.2.3

      - name: Show forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

  slither:
    name: slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned so `forge fmt` agrees with local dev machines — different
          # forge versions format borderline lines differently, which turns
          # `forge fmt --check` into a moving target. Bump deliberately and
          # tell contributors to `foundryup --version <tag>` in sync.
          version: v1.2.3

      # Blocking since GHO-19, which triaged every finding above informational
      # to zero. Each suppression is inline at its site with the reason, so a
      # new finding of the same kind still fails here.
      #
      # `timestamp` is the one detector excluded wholesale. It flags every
      # comparison against block.timestamp, and in a protocol whose product is
      # time windows that is all thirty of them. The real question behind it —
      # how far Arbitrum's sequencer may skew block.timestamp against a
      # 15-second entry cutoff — is an open decision in the runbook, not
      # something this detector can answer.
      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: ghoststake-contracts
          slither-args: --filter-paths "lib/|test/|script/" --exclude timestamp
          fail-on: low
