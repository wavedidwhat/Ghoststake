name: backend-ci

on:
  push:
    branches: ["main"]
    paths:
      - "ghoststake-backend/**"
      - ".github/workflows/backend-ci.yml"
  # No path filter here on purpose: a workflow skipped by path filtering
  # never reports its check, and a REQUIRED check that never reports leaves
  # the PR permanently "Expected — waiting for status". Cheap to just run.
  pull_request:

defaults:
  run:
    working-directory: ghoststake-backend

jobs:
  build:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ghoststake-backend/go.mod
          cache-dependency-path: ghoststake-backend/go.sum

      - name: Lint (vet + gofmt)
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build
